<!doctype html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Andres Crucitti — Senior PHP / Laravel Developer</title>
  <meta name="description" content="Senior PHP / Laravel developer, 15+ years. Open to remote roles.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=6ae36eb8">
  <script src="content.js?v=d06c31e5"></script>
  <script src="fade.js?v=1f95f68e" defer></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.5/dist/cdn.min.js" integrity="sha384-FYLKjwG3aohNhNZoVG8sY/5ntunm+MqylL90Q+rT3OM7AwV9/BKFjk/RjoIpIgsI" crossorigin="anonymous"></script>
  <style>
    .cursor::after { content: '▋'; animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body class="bg-slate-950 font-mono text-slate-300 antialiased"
      x-data="{ ...site, active: 'about', typed: '', cmd: 'whoami' }"
      x-init="
        let i = 0; const t = setInterval(() => { typed = cmd.slice(0, ++i); if (i >= cmd.length) clearInterval(t) }, 90);
        const o = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && (active = e.target.id)), { rootMargin: '-40% 0px -55% 0px' });
        $nextTick(() => { $el.querySelectorAll('section[id]').forEach(s => o.observe(s)) })">

  <div class="pointer-events-none fixed inset-0 -z-10 bg-[radial-gradient(ellipse_at_top,rgba(16,185,129,.12),transparent_60%),radial-gradient(ellipse_at_bottom_right,rgba(99,102,241,.12),transparent_50%)]"></div>

  <header class="fixed inset-x-0 top-0 z-10 border-b border-slate-800 bg-slate-950/80 backdrop-blur">
    <nav class="mx-auto flex max-w-4xl items-center justify-between px-6 py-3 text-sm">
      <a href="#about" class="text-emerald-400">~/<span x-text="name.split(' ')[0].toLowerCase()"></span></a>
      <div class="hidden gap-5 sm:flex">
        <template x-for="s in sections" :key="s">
          <a :href="'#' + s" class="hover:text-emerald-400" :class="active === s && 'text-emerald-400'" x-text="'./' + s"></a>
        </template>
      </div>
    </nav>
  </header>

  <main class="mx-auto max-w-4xl px-6 pt-14">

    <section id="about" class="flex min-h-screen scroll-mt-14 flex-col justify-center py-20">
      <div class="rounded-lg border border-slate-800 bg-slate-900/70 shadow-2xl">
        <div class="flex gap-1.5 border-b border-slate-800 px-4 py-3">
          <span class="h-3 w-3 rounded-full bg-red-500/80"></span><span class="h-3 w-3 rounded-full bg-yellow-500/80"></span><span class="h-3 w-3 rounded-full bg-emerald-500/80"></span>
        </div>
        <div class="space-y-1 p-6 text-sm sm:text-base">
          <p><span class="text-emerald-400">$</span> <span class="cursor" x-text="typed"></span></p>
          <h1 class="pt-4 text-4xl font-bold sm:text-5xl"><span class="bg-gradient-to-r from-emerald-400 to-indigo-400 bg-clip-text text-transparent" x-text="name"></span></h1>
          <p class="text-emerald-400" x-text="role"></p>
          <p class="max-w-2xl pt-3 text-slate-400" x-text="pitch"></p>
          <p class="pt-1 text-slate-500" x-text="'# ' + location"></p>
        </div>
      </div>
      <div class="mt-6 flex flex-wrap gap-3 text-sm">
        <a :href="'mailto:' + links.email" class="rounded bg-emerald-500 px-4 py-2 font-semibold text-slate-950 hover:bg-emerald-400">contact --email</a>
        <a :href="links.resume" class="rounded border border-slate-700 px-4 py-2 hover:border-emerald-400">cat resume</a>
        <a :href="links.github" class="rounded border border-slate-700 px-4 py-2 hover:border-emerald-400">open github</a>
        <a :href="links.linkedin" class="rounded border border-slate-700 px-4 py-2 hover:border-emerald-400">open linkedin</a>
        <template x-for="s in sections.filter(s => !['about', 'contact'].includes(s))" :key="s">
          <a :href="'#' + s" class="rounded border border-slate-700 px-4 py-2 hover:border-emerald-400" x-text="'./' + s"></a>
        </template>
      </div>
    </section>

    <section id="projects" class="scroll-mt-14 py-20">
      <h2 class="group reveal text-2xl font-bold text-emerald-400"><a href="#projects">ls projects/<span class="ml-2 opacity-0 transition group-hover:opacity-60" aria-hidden="true">#</span></a></h2>
      <div class="mt-8 grid gap-4 sm:grid-cols-2">
        <template x-for="p in projects" :key="p.name">
          <a :href="p.url ?? links.github + '/' + p.name" class="reveal group rounded-lg border border-slate-800 bg-slate-900/50 p-5 transition hover:border-emerald-400 hover:shadow-[0_0_24px_-6px_rgba(16,185,129,.5)]">
            <h3 class="font-semibold text-slate-100 group-hover:text-emerald-400" x-text="p.title ?? (p.name + '/')"></h3>
            <p class="mt-1 text-xs text-indigo-400"><span x-text="p.stack"></span><span x-show="p.contrib" class="ml-2 rounded border border-emerald-500/50 px-1.5 py-0.5 text-emerald-400">merged PR</span></p>
            <p class="mt-3 text-sm text-slate-400" x-text="p.text"></p>
          </a>
        </template>
      </div>
    </section>

    <section id="skills" class="scroll-mt-14 py-20">
      <h2 class="group reveal text-2xl font-bold text-emerald-400"><a href="#skills">cat skills.json<span class="ml-2 opacity-0 transition group-hover:opacity-60" aria-hidden="true">#</span></a></h2>
      <div class="mt-8 grid gap-4 sm:grid-cols-2">
        <template x-for="(items, group) in skills" :key="group">
          <div class="reveal rounded-lg border border-slate-800 bg-slate-900/50 p-6">
            <h3 class="text-lg font-semibold text-indigo-400" x-text="'&quot;' + group.toLowerCase() + '&quot;: ['"></h3>
            <div class="mt-4 flex flex-wrap gap-x-3 gap-y-2 pl-4 text-sm">
              <template x-for="i in items" :key="i">
                <span class="text-emerald-300" x-text="'&quot;' + i + '&quot;'"></span>
              </template>
            </div>
            <p class="mt-4 text-slate-500">]</p>
          </div>
        </template>
      </div>
    </section>

    <section id="experience" class="scroll-mt-14 py-20">
      <h2 class="group reveal text-2xl font-bold text-emerald-400"><a href="#experience">git log --career<span class="ml-2 opacity-0 transition group-hover:opacity-60" aria-hidden="true">#</span></a></h2>
      <ol class="mt-8 space-y-6">
        <template x-for="e in experience" :key="e.years">
          <li class="reveal border-l-2 border-emerald-500/50 pl-5">
            <p class="text-xs text-indigo-400" x-text="e.years"></p>
            <h3 class="text-lg font-semibold text-slate-100" x-text="e.company"></h3>
            <p class="text-sm text-emerald-400"><span x-text="e.title"></span> · <span x-text="e.meta"></span></p>
            <p class="mt-3 text-sm text-slate-400" x-text="e.text"></p>
            <ul class="mt-3 space-y-2">
              <template x-for="p in e.points" :key="p">
                <li class="relative pl-4 text-sm text-slate-400 before:absolute before:left-0 before:text-emerald-500 before:content-['›']" x-text="p"></li>
              </template>
            </ul>
          </li>
        </template>
      </ol>
    </section>

    <section id="contact" class="scroll-mt-14 py-20">
      <h2 class="group reveal text-2xl font-bold text-emerald-400"><a href="#contact">./contact<span class="ml-2 opacity-0 transition group-hover:opacity-60" aria-hidden="true">#</span></a></h2>
      <p class="reveal mt-4 text-slate-400">Open to remote, hybrid or on-site work in the Los Angeles area.</p>
      <a :href="'mailto:' + links.email" class="reveal mt-4 inline-block text-xl text-emerald-400 hover:underline" x-text="links.email"></a>
    </section>

    <footer class="border-t border-slate-800 py-8 text-xs text-slate-600">
      © <span x-text="new Date().getFullYear()"></span> <span x-text="name"></span>
    </footer>
  </main>
</body>
</html>
