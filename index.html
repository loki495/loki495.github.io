  <script>
    document.documentElement.classList.toggle('dark', localStorage.dark ? localStorage.dark === '1' : matchMedia('(prefers-color-scheme: dark)').matches)
    function app() {
      return {
        ...site,
        dark: document.documentElement.classList.contains('dark'),
        active: 'about',
        // hue offset per section, so the background drifts as you scroll
        shift: { about: 0, projects: 15, skills: 30, experience: 15, contact: -10 },
        get hue() { return 225 + (this.shift[this.active] ?? 0) },
      }
    }
  </script>
  <style>
    @property --hue { syntax: '<number>'; inherits: true; initial-value: 225; }
    html { font-size: 118.75%; transition: --hue 1.4s ease; }
    .glow {
      --a: .16; --boost: 14%;
      position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%; will-change: transform;
      background: radial-gradient(circle, hsl(calc(var(--hue) + var(--off)) 85% calc(38% + var(--boost)) / var(--a)) 0%, transparent 65%);
    }
    .dark .glow { --a: .24; --boost: 0%; }
    .glow-a { --off: 0; top: -25vmax; left: -20vmax; }
    .glow-b { --off: 35; top: 30vh; right: -30vmax; }
    .glow-c { --off: -30; bottom: -35vmax; left: 5vmax; }
    .grid-bg {
      position: absolute; inset: 0;
      background-image: linear-gradient(to right, hsl(var(--hue) 60% 55% / .12) 1px, transparent 1px), linear-gradient(to bottom, hsl(var(--hue) 60% 55% / .12) 1px, transparent 1px);
      background-size: 56px 56px;
      -webkit-mask-image: radial-gradient(ellipse 85% 80% at 50% 50%, #000 30%, transparent 90%);
      mask-image: radial-gradient(ellipse 85% 80% at 50% 50%, #000 30%, transparent 90%);
    }
  </style>

<body class="bg-white text-slate-800 antialiased dark:bg-slate-950 dark:text-slate-100"
      x-data="app()"
      x-init="$watch('dark', v => { localStorage.dark = v ? 1 : 0; document.documentElement.classList.toggle('dark', v) })"
      x-effect="document.documentElement.style.setProperty('--hue', hue)">

  <noscript>
    <div class="mx-auto max-w-2xl px-6 py-24">
      <h1 class="text-4xl font-bold">Andres Crucitti</h1>
      <p class="mt-2 text-lg">Senior PHP / Laravel Developer · Los Angeles, CA</p>
      <p class="mt-4">15+ years building and running PHP applications, from e-commerce and CRMs to self-hosted tools. Looking for a permanent backend or full-stack role.</p>
      <p class="mt-4">
        <a class="underline" href="mailto:andres@ac495.net">andres@ac495.net</a> ·
        <a class="underline" href="https://github.com/loki495">GitHub</a> ·
        <a class="underline" href="https://linkedin.com/in/andres-crucitti">LinkedIn</a>
      </p>
    </div>
  </noscript>

  <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden" aria-hidden="true">
    <div class="grid-bg" data-parallax-bg="0.15"></div>
    <div class="glow glow-a" data-parallax="0.12"></div>
    <div class="glow glow-b" data-parallax="0.07"></div>
    <div class="glow glow-c" data-parallax="0.16"></div>
  </div>

  <header class="fixed inset-x-0 top-0 z-10 border-b border-slate-200 bg-white/80 backdrop-blur dark:border-slate-800 dark:bg-slate-950/80">
    <nav class="mx-auto flex max-w-4xl items-center justify-between px-6 py-3 text-sm">
      <a href="#about" class="font-semibold" x-text="name"></a>
      <div class="flex items-center gap-5">
        <template x-for="s in sections" :key="s">
          <a :href="'#' + s" class="hidden capitalize hover:text-indigo-600 sm:inline dark:hover:text-indigo-400"
             :class="active === s && 'text-indigo-600 dark:text-indigo-400'" x-text="s"></a>
        </template>
        <button @click="dark = !dark" class="rounded border border-slate-300 px-2 py-1 dark:border-slate-700" aria-label="Toggle dark mode" x-text="dark ? 'Light' : 'Dark'"></button>
      </div>
    </nav>
  </header>

  <main class="mx-auto max-w-4xl px-6 pt-14"
        x-init="const o = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && (active = e.target.id)), { rootMargin: '-40% 0px -55% 0px' }); $nextTick(() => { $el.querySelectorAll('section[id]').forEach(s => o.observe(s)) })">

    <section id="about" class="relative flex min-h-screen scroll-mt-14 flex-col justify-center py-20 text-center sm:text-left">
      <p class="text-sm font-medium uppercase tracking-widest text-indigo-600 dark:text-indigo-400" x-text="role"></p>
      <h1 class="mt-3 text-5xl font-bold tracking-tight sm:text-6xl" x-text="name"></h1>
      <p class="mx-auto mt-6 max-w-2xl text-lg sm:mx-0 text-slate-700 dark:text-slate-300" x-text="pitch"></p>
      <p class="mt-2 text-sm text-slate-600 dark:text-slate-400" x-text="location"></p>
      <div class="mt-8 flex flex-wrap justify-center gap-3 text-sm sm:justify-start">
        <a :href="'mailto:' + links.email" class="rounded bg-indigo-600 px-4 py-2 font-medium text-white hover:bg-indigo-500">Email me</a>
        <a :href="links.resume" class="rounded border border-slate-300 px-4 py-2 hover:border-indigo-500 dark:border-slate-700">Resume</a>
        <a :href="links.github" class="rounded border border-slate-300 px-4 py-2 hover:border-indigo-500 dark:border-slate-700">GitHub</a>
        <a :href="links.linkedin" class="rounded border border-slate-300 px-4 py-2 hover:border-indigo-500 dark:border-slate-700">LinkedIn</a>
        <template x-for="s in sections.filter(s => !['about', 'contact'].includes(s))" :key="s">
          <a :href="'#' + s" class="rounded border border-slate-300 px-4 py-2 capitalize hover:border-indigo-500 dark:border-slate-700" x-text="s"></a>
        </template>
      </div>
    </section>

    <section id="projects" class="scroll-mt-14 py-20">
      <h2 class="reveal text-3xl font-bold sm:text-4xl"><a href="#projects">Projects</a></h2>
      <div class="mt-8 grid gap-4 sm:grid-cols-2">
        <template x-for="p in projects" :key="p.name">
          <a :href="p.url ?? links.github + '/' + p.name" class="reveal group rounded-lg border border-slate-200 p-5 hover:border-indigo-500 dark:border-slate-800 bg-slate-900/[0.03] dark:bg-white/[0.04]">
            <h3 class="font-semibold group-hover:text-indigo-600 dark:group-hover:text-indigo-400" x-text="p.title ?? p.name"></h3>
            <p class="mt-1 text-sm text-slate-600 dark:text-slate-400"><span x-text="p.stack"></span><span x-show="p.contrib" class="ml-2 rounded bg-indigo-100 px-1.5 py-0.5 font-medium text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300">Merged PR</span></p>
            <p class="mt-3 text-sm text-slate-700 dark:text-slate-300" x-text="p.text"></p>
          </a>
        </template>
      </div>
    </section>

    <section id="skills" class="scroll-mt-14 py-20">
      <h2 class="reveal text-3xl font-bold sm:text-4xl"><a href="#skills">Skills</a></h2>
      <div class="mt-8 grid gap-4 sm:grid-cols-2">
        <template x-for="(items, group) in skills" :key="group">
          <div class="reveal rounded-lg border border-slate-200 p-6 dark:border-slate-800 bg-slate-900/[0.03] dark:bg-white/[0.04]">
            <h3 class="text-lg font-semibold" x-text="group"></h3>
            <div class="mt-4 flex flex-wrap gap-2">
              <template x-for="i in items" :key="i">
                <span class="rounded-full bg-slate-100 px-3 py-1 text-sm dark:bg-slate-800" x-text="i"></span>
              </template>
            </div>
          </div>
        </template>
      </div>
    </section>

    <section id="experience" class="scroll-mt-14 py-20">
      <h2 class="reveal text-3xl font-bold sm:text-4xl"><a href="#experience">Experience</a></h2>
      <ol class="mt-8 space-y-8 border-l border-slate-200 pl-6 dark:border-slate-800">
        <template x-for="e in experience" :key="e.years">
          <li class="reveal relative">
            <span class="absolute -left-[31px] top-1.5 h-2.5 w-2.5 rounded-full bg-indigo-600"></span>
            <p class="text-sm text-slate-600 dark:text-slate-400" x-text="e.years"></p>
            <h3 class="text-lg font-semibold" x-text="e.company"></h3>
            <p class="text-sm text-slate-600 dark:text-slate-400"><span x-text="e.title"></span> · <span x-text="e.meta"></span></p>
            <p class="mt-3 text-sm text-slate-700 dark:text-slate-300" x-text="e.text"></p>
            <ul class="mt-3 space-y-2">
              <template x-for="p in e.points" :key="p">
                <li class="relative pl-4 text-sm text-slate-700 before:absolute before:left-0 before:top-2 before:h-1 before:w-1 before:rounded-full before:bg-indigo-500 dark:text-slate-300" x-text="p"></li>
              </template>
            </ul>
          </li>
        </template>
      </ol>
    </section>

    <section id="contact" class="scroll-mt-14 py-20">
      <h2 class="reveal text-3xl font-bold sm:text-4xl"><a href="#contact">Contact</a></h2>
      <p class="reveal mt-4 text-slate-700 dark:text-slate-300">Open to remote, hybrid or on-site work in the Los Angeles area.</p>
      <a :href="'mailto:' + links.email" class="reveal mt-4 inline-block text-xl font-medium text-indigo-600 hover:underline dark:text-indigo-400" x-text="links.email"></a>
    </section>

    <footer class="border-t border-slate-200 py-8 text-sm text-slate-600 dark:text-slate-400 dark:border-slate-800">
      © <span x-text="new Date().getFullYear()"></span> <span x-text="name"></span>
    </footer>
  </main>
</body>
</html>
